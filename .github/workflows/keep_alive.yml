name: Keep App Alive (Playwright Auto-Wake)

on:
  schedule:
    # Executa a cada 6 horas (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch: # Permite disparar manualmente pelo GitHub

jobs:
  auto-wake:
    name: Wake and Keep App Alive
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright & Chromium
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Run Auto-Wake Script
        run: |
          python - << 'EOF'
          import time
          from playwright.sync_api import sync_playwright

          urls = [
              "https://radar-julius-c6w8h7d9iv2uge3rgphuj4.streamlit.app",
              "https://evolucao-saude-cmx3ay3lqw2ndcbvsqc76d.streamlit.app"
          ]

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36")
              page = context.new_page()

              for url in urls:
                  print(f"\n==================================================")
                  print(f"--> Conectando em: {url}")
                  print(f"==================================================")
                  try:
                      page.goto(url, timeout=60000)
                      time.sleep(5)

                      # Procura pelo botão de acordar com polling ativo
                      wake_btn = None
                      for attempt in range(6):
                          wake_btn = page.query_selector('button:has-text("Yes, get this app back up!")') or page.query_selector('button:has-text("wake it back up")')
                          if wake_btn:
                              break
                          time.sleep(2)

                      if wake_btn:
                          print("⚡ STATUS: App estava dormindo (Zzzz)!")
                          print("👉 Clicando no botão 'Yes, get this app back up!'...")
                          wake_btn.click()
                          print("✅ Clique efetuado! Aguardando o container reiniciar...")

                          # Aguarda até 90s para o Streamlit renderizar o app
                          app_ready = False
                          for i in range(18):
                              time.sleep(5)
                              if page.query_selector('[data-testid="stAppViewContainer"]') or page.query_selector('.main'):
                                  app_ready = True
                                  print(f"🎉 SUCESSO: App acordou e carregou a interface em {(i+1)*5}s!")
                                  break
                              print(f"Aguardando container subir... ({(i+1)*5}s)")

                          if not app_ready:
                              print("⚠️ Botão foi clicado, container está em processo de boot no Streamlit Cloud.")
                      else:
                          if page.query_selector('[data-testid="stAppViewContainer"]') or page.query_selector('.main'):
                              print("✅ STATUS: App já está acordado e com a interface carregada!")
                          else:
                              body_text = page.locator('body').inner_text()
                              print("Texto visível na página:", body_text[:200].replace('\n', ' '))

                      # Permanece conectado por 10 segundos para firmar a sessão WebSocket
                      time.sleep(10)
                  except Exception as e:
                      print(f"❌ Erro ao processar {url}: {e}")

              browser.close()
              print("\nRotina de despertar finalizada com sucesso!")
          EOF
