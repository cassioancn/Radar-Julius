name: Keep App Alive (Auto-Wake)

on:
  schedule:
    # Executa a cada 4 horas para prevenir hibernação do Streamlit Cloud
    - cron: '0 */4 * * *'
  workflow_dispatch: # Permite disparar manualmente pela aba Actions do GitHub

jobs:
  auto-wake:
    name: Wake and Keep Streamlit Apps Alive
    runs-on: ubuntu-latest
    steps:
      - name: Wake Apps via Streamlit Keep Alive
        uses: gpenessot/streamlit-keep-alive@v1
        with:
          app-urls: |
            https://radar-julius-c6w8h7d9iv2uge3rgphuj4.streamlit.app
            https://evolucao-saude-cmx3ay3lqw2ndcbvsqc76d.streamlit.app
