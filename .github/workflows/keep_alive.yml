name: Keep App Alive (Auto-Wake)

on:
  schedule:
    # Executa a cada 4 horas (00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC) para prevenir hibernação do Streamlit Cloud
    - cron: '0 */4 * * *'
  workflow_dispatch: # Permite disparar manualmente pela aba Actions do GitHub

jobs:
  auto-wake:
    name: Wake and Keep Streamlit Apps Alive
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Playwright & Chromium
        run: |
          pip install playwright
          python -m playwright install chromium --with-deps

      - name: Run Auto-Wake Script
        run: python scripts/auto_wake.py
